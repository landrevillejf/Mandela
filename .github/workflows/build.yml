name: Build

# CI for Project Mandela as a standalone, single-project Gradle build
# (Gradle 8.14 + JDK 21). The whole language -- lexer, parser, compiler, stack
# VM, capability-gated runtime, standard library, JSR-223 engine, embedding API
# and CLI -- is one module at the repository root, so a plain checkout fetches
# everything `./gradlew build` compiles: there are no subprojects and no git
# submodules. The suite is headless (java.awt.headless=true) and the jar is
# dependency-free, so ubuntu-latest needs no X display and no third-party
# service to go green.

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same branch/ref supersedes an in-flight run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & test (JDK 21)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          # Verify gradle-wrapper.jar against the published Gradle distribution
          # and cache the Gradle user home between runs.
          validate-wrappers: true
          cache-read-only: ${{ github.ref != 'refs/heads/master' && github.ref != 'refs/heads/main' }}

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      # Run the suite as its own visible CI step so a test failure is attributed
      # here rather than buried inside `build`.
      - name: Run tests
        run: ./gradlew test --stacktrace

      # Compile + jar (`build` re-runs the now up-to-date tests via `check`).
      - name: Build the jar
        run: ./gradlew build --stacktrace

      - name: Upload test & coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mandela-test-reports
          path: |
            build-gradle/reports/tests/**
            build-gradle/reports/jacoco/**
            build-gradle/reports/cucumber/**
            build-gradle/test-results/**
          if-no-files-found: warn

      - name: Upload the language jar
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: mandela-jar
          path: build-gradle/libs/*.jar
          if-no-files-found: error
